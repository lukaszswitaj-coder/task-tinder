<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Swipe - Debug</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <style>
    body { 
      font-family: monospace, sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      background: #121212; 
      color: #fff; 
      flex-direction: column;
      padding: 10px;
      box-sizing: border-box;
    }
    #card { 
      width: 90%; 
      max-width: 380px; 
      min-height: 320px; 
      background: #1e1e1e; 
      border-radius: 16px; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: flex-start; 
      padding: 20px; 
      box-shadow: 0 10px 20px rgba(0,0,0,0.5); 
      box-sizing: border-box;
    }
    #debug-log {
      width: 100%;
      font-size: 0.8rem;
      color: #00ff66;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.4;
      background: #000;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      max-height: 180px;
      overflow-y: auto;
    }
    button { 
      padding: 12px 24px; 
      font-size: 1rem; 
      margin-top: 10px; 
      cursor: pointer; 
      border-radius: 8px;
      border: none;
      background: #007bff;
      color: white;
    }
    #switch-account {
      margin-top: 20px;
      background: transparent;
      color: #888;
      font-size: 0.8rem;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <button id="login-btn" onclick="handleAuth()">Zaloguj z Google</button>
  
  <div id="card" style="display:none;">
    <h3 style="margin-top:0;" id="status-head">Diagnostyka API</h3>
    <div id="debug-log">Inicjalizacja...</div>
  </div>
  
  <button id="switch-account" style="display:none;" onclick="handleAuth()">Zmień konto Google</button>

  <script>
    const CLIENT_ID = '21542541771-b5kbbkkjqivcbrbs7s5dcpittgu1q0fe.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/tasks';
    let accessToken = null, tasks = [], tokenClient;

    function log(msg) {
      const el = document.getElementById('debug-log');
      el.innerText += '\n' + msg;
      el.scrollTop = el.scrollHeight;
    }

    function handleAuth() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID, 
        scope: SCOPES,
        prompt: 'select_account',
        callback: (res) => { 
          if (res.error) {
            alert('Błąd autoryzacji: ' + JSON.stringify(res));
            return;
          }
          accessToken = res.access_token; 
          document.getElementById('login-btn').style.display = 'none'; 
          document.getElementById('switch-account').style.display = 'block';
          document.getElementById('card').style.display = 'flex';
          document.getElementById('debug-log').innerText = 'Zalogowano! Pobieranie danych...';
          loadTasksDebug(); 
        }
      });
      tokenClient.requestAccessToken();
    }

    async function loadTasksDebug() {
      try {
        log('➔ Wysyłam zapytanie o listy zadań...');
        const listsRes = await fetch('https://tasks.googleapis.com/tasks/v1/users/@me/lists', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });

        if (!listsRes.ok) {
          log(`❌ BŁĄD LIST (${listsRes.status}): ${await listsRes.text()}`);
          return;
        }

        const listsData = await listsRes.json();
        const taskLists = listsData.items || [];
        log(`✔ Znaleziono list zadań: ${taskLists.length}`);

        let totalRawTasks = 0;
        tasks = [];

        for (const list of taskLists) {
          log(`➔ Pobieram zadania z listy: "${list.title}"...`);
          
          const res = await fetch(`https://tasks.googleapis.com/tasks/v1/lists/${list.id}/tasks?showCompleted=false&maxResults=100`, {
            headers: { Authorization: `Bearer ${accessToken}` }
          });

          if (!res.ok) {
            log(`❌ Błąd pobierania zadań dla "${list.title}": ${res.status}`);
            continue;
          }

          const data = await res.json();
          const items = data.items || [];
          log(`   -> Znalazłem w niej nieukończonych zadań: ${items.length}`);
          
          totalRawTasks += items.length;

          items.forEach(t => {
            tasks.push({
              title: t.title,
              due: t.due || 'BRAK DATY',
              listTitle: list.title
            });
          });
        }

        log(`\n============================`);
        log(`SUMA POBRANYCH ZADAŃ: ${totalRawTasks}`);
        log(`============================`);

        if (tasks.length > 0) {
          log(`\nPierwsze zadanie na liście:`);
          log(`Tytuł: "${tasks[0].title}"`);
          log(`Data: ${tasks[0].due}`);
        } else {
          log(`\n⚠️ API zwróciło 0 nieukończonych zadań ze wszystkich list!`);
        }

      } catch (err) {
        log(`❌ Błąd JS: ${err.message}`);
      }
    }
  </script>
</body>
</html>
