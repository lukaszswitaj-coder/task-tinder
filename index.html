<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Task Swipe</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
      background: #0f0f12; 
      color: #fff; 
      flex-direction: column;
      overflow: hidden;
      touch-action: none;
      padding: 16px 12px;
    }
    
    .hint-bar {
      font-size: 0.85rem;
      color: #a55eea;
      text-align: center;
      background: rgba(165, 94, 234, 0.08);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(165, 94, 234, 0.2);
      width: 100%;
      max-width: 360px;
    }
    
    .horizontal-hints {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 360px;
      font-size: 0.8rem;
      color: #aaa;
      padding: 0 4px;
    }

    #card-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      margin: 12px 0;
    }

    #card { 
      width: 100%; 
      max-height: 70vh; 
      background: #1a1a24; 
      border-radius: 20px; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center; 
      padding: 24px 20px; 
      text-align: center; 
      box-shadow: 0 12px 30px rgba(0,0,0,0.7); 
      user-select: none; 
      position: relative; 
      border: 2px solid #2e2e3e;
      overflow-y: auto;
      will-change: transform;
      transition: background-color 0.2s, border-color 0.2s;
    }

    #task-title {
      font-size: 1.25rem;
      line-height: 1.5;
      font-weight: 600;
      word-break: break-word;
      white-space: pre-wrap;
      color: #ffffff;
      margin-bottom: 12px;
    }

    #task-list-name {
      font-size: 0.75rem;
      color: #ff9f43;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
    }

    #task-due-date {
      font-size: 0.8rem;
      color: #ff5252;
      background: rgba(255, 82, 82, 0.1);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 14px;
      display: inline-block;
    }

    #modal { 
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0,0,0,0.85); 
      justify-content: center; 
      align-items: center; 
      z-index: 10;
    }

    .modal-content { 
      background: #222; 
      padding: 24px; 
      border-radius: 16px; 
      text-align: center; 
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      width: 85%;
      max-width: 320px;
    }

    input[type="date"] {
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #444;
      background: #333;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    button { 
      padding: 12px 24px; 
      font-size: 1rem; 
      margin-top: 12px; 
      cursor: pointer; 
      border-radius: 10px;
      border: none;
      background: #007bff;
      color: white;
      font-weight: bold;
    }

    #switch-account {
      background: transparent;
      color: #666;
      font-size: 0.75rem;
      text-decoration: underline;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Górna instrukcja -->
  <div class="hint-bar">
    ⬆️ <b>SWIPE UP:</b> Kolejny poniedziałek
  </div>

  <!-- Główny kontener -->
  <div id="card-container">
    <button id="login-btn" onclick="handleAuth()">Zaloguj z Google</button>
    
    <div id="card" style="display:none;">
      <div id="task-list-name"></div>
      <div id="task-due-date"></div>
      <div id="task-title">Ładowanie zaległych zadań...</div>
      <div id="hold-hint" style="font-size: 0.75rem; color: #777; margin-top: 10px;">👆 Przytrzymaj = Wybór daty w kalendarzu</div>
      <button id="reload-btn" style="display:none;" onclick="reloadTasks()">Odśwież listę 🔄</button>
    </div>
  </div>

  <!-- Wskaźniki Lewo / Prawo -->
  <div class="horizontal-hints">
    <span>⬅️ <b>LEWO:</b> Na jutro</span>
    <span><b>PRAWO:</b> Na dziś ➡️</span>
  </div>

  <!-- Dolna instrukcja -->
  <div class="hint-bar" style="color: #2ed573; background: rgba(46, 213, 115, 0.08); border-color: rgba(46, 213, 115, 0.2);">
    ⬇️ <b>SWIPE DOWN:</b> Oznacz jako zrobione
  </div>

  <button id="switch-account" style="display:none;" onclick="logout()">Zmień konto / Wyloguj</button>

  <!-- Modal kalendarza -->
  <div id="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">Wybierz datę przełożenia</h3>
      <input type="date" id="custom-date">
      <br>
      <button onclick="submitCustomDate()">Zapisz</button>
    </div>
  </div>

  <script>
    const CLIENT_ID = '21542541771-b5kbbkkjqivcbrbs7s5dcpittgu1q0fe.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/tasks';
    let accessToken = localStorage.getItem('google_tasks_token') || null;
    let tasks = [], currentIndex = 0, tokenClient, hammerManager = null;

    // Po załadowaniu strony sprawdzamy, czy token jest już w pamięci
    window.addEventListener('DOMContentLoaded', () => {
      if (accessToken) {
        document.getElementById('login-btn').style.display = 'none';
        document.getElementById('switch-account').style.display = 'block';
        loadTasks();
      }
    });

    function handleAuth() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID, 
        scope: SCOPES,
        prompt: 'select_account',
        callback: (res) => { 
          if (res.error) return;
          accessToken = res.access_token; 
          // Zapisujemy token w localStorage
          localStorage.setItem('google_tasks_token', accessToken);
          document.getElementById('login-btn').style.display = 'none'; 
          document.getElementById('switch-account').style.display = 'block';
          reloadTasks();
        }
      });
      tokenClient.requestAccessToken();
    }

    function logout() {
      localStorage.removeItem('google_tasks_token');
      accessToken = null;
      document.getElementById('card').style.display = 'none';
      document.getElementById('login-btn').style.display = 'block';
      document.getElementById('switch-account').style.display = 'none';
    }

    function reloadTasks() {
      currentIndex = 0;
      tasks = [];
      document.getElementById('reload-btn').style.display = 'none';
      loadTasks();
    }

    async function loadTasks() {
      const card = document.getElementById('card');
      const taskTitle = document.getElementById('task-title');
      const taskListName = document.getElementById('task-list-name');
      const taskDueDate = document.getElementById('task-due-date');

      taskTitle.innerText = "Ładowanie zaległych zadań...";
      taskListName.innerText = "";
      taskDueDate.innerText = "";
      card.style.display = 'flex';

      try {
        const listsRes = await fetch('https://tasks.googleapis.com/tasks/v1/users/@me/lists', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        
        // Jeśli token wygasł (błąd 401), wyczyszczamy sesję i prosimy o ponowne zalogowanie
        if (listsRes.status === 401) {
          logout();
          return;
        }

        const listsData = await listsRes.json();
        const taskLists = listsData.items || [];

        // Pobieramy dzisiejszą datę lokalną YYYY-MM-DD
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const todayStr = `${year}-${month}-${day}`;

        // Koniec dzisiejszego dnia dla bufora Google API
        const endOfTodayISO = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59).toISOString();

        tasks = [];

        for (const list of taskLists) {
          const res = await fetch(`https://tasks.googleapis.com/tasks/v1/lists/${list.id}/tasks?showCompleted=false&dueMax=${endOfTodayISO}&maxResults=100`, {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          const data = await res.json();
          const items = data.items || [];

          const mapped = items.filter(t => {
            if (!t.title || t.title.trim() === '' || !t.due) return false;
            
            const taskDateStr = t.due.split('T')[0];
            // ŚCIŚLE POPRZEDNIE DNI: data zadania musi być mniejsza od dzisiejszej daty lokalnej
            return taskDateStr < todayStr;
          }).map(t => ({ 
            ...t, 
            listId: list.id, 
            listTitle: list.title,
            formattedDueDate: t.due.split('T')[0]
          }));

          tasks = tasks.concat(mapped);
        }

        showNextTask();
      } catch (err) {
        console.error(err);
        taskTitle.innerText = "Błąd pobierania zadań!";
      }
    }

    function showNextTask() {
      const card = document.getElementById('card');
      const taskTitle = document.getElementById('task-title');
      const taskListName = document.getElementById('task-list-name');
      const taskDueDate = document.getElementById('task-due-date');
      const holdHint = document.getElementById('hold-hint');
      const reloadBtn = document.getElementById('reload-btn');

      card.style.transition = 'none';
      card.style.transform = 'none';
      card.style.backgroundColor = '#1a1a24';
      card.style.borderColor = '#2e2e3e';

      if (currentIndex >= tasks.length) {
        taskListName.innerText = "";
        taskDueDate.style.display = "none";
        holdHint.style.display = "none";
        taskTitle.innerText = "Wszystkie zaległe zadania ogarnięte! 🎉";
        reloadBtn.style.display = "inline-block";
        return;
      }

      holdHint.style.display = "block";
      reloadBtn.style.display = "none";

      const currentTask = tasks[currentIndex];
      card.style.display = 'flex';
      
      taskListName.innerText = currentTask.listTitle;
      taskDueDate.style.display = "inline-block";
      taskDueDate.innerText = `⏰ Zaległe od: ${currentTask.formattedDueDate}`;
      taskTitle.innerText = currentTask.title;

      initGestures(card);
    }

    function initGestures(el) {
      if (hammerManager) hammerManager.destroy();

      hammerManager = new Hammer(el);
      hammerManager.get('pan').set({ direction: Hammer.DIRECTION_ALL });

      const THRESHOLD = 80;

      hammerManager.on("panmove", (ev) => {
        const x = ev.deltaX;
        const y = ev.deltaY;
        const rotate = x * 0.05;

        el.style.transition = 'none';
        el.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${rotate}deg)`;

        if (Math.abs(y) > Math.abs(x)) {
          if (y > 30) {
            el.style.backgroundColor = 'rgba(46, 213, 115, 0.2)';
            el.style.borderColor = '#2ed573';
          } else if (y < -30) {
            el.style.backgroundColor = 'rgba(165, 94, 234, 0.2)';
            el.style.borderColor = '#a55eea';
          }
        } else {
          if (x > 30) {
            el.style.backgroundColor = 'rgba(0, 122, 255, 0.2)';
            el.style.borderColor = '#007bff';
          } else if (x < -30) {
            el.style.backgroundColor = 'rgba(255, 159, 67, 0.2)';
            el.style.borderColor = '#ff9f43';
          }
        }
      });

      hammerManager.on("panend", (ev) => {
        const x = ev.deltaX;
        const y = ev.deltaY;

        el.style.transition = 'transform 0.25s ease, background-color 0.25s, border-color 0.25s';

        if (Math.abs(y) > Math.abs(x) && Math.abs(y) > THRESHOLD) {
          if (y > 0) updateTask('complete');
          else updateTask('monday');
        } else if (Math.abs(x) > Math.abs(y) && Math.abs(x) > THRESHOLD) {
          if (x > 0) updateTask('today');
          else updateTask('tomorrow');
        } else {
          el.style.transform = 'translate3d(0, 0, 0) rotate(0deg)';
          el.style.backgroundColor = '#1a1a24';
          el.style.borderColor = '#2e2e3e';
        }
      });

      hammerManager.on("press", () => document.getElementById('modal').style.display = 'flex');
    }

    async function updateTask(action, customDate = null) {
      const task = tasks[currentIndex];
      const url = `https://tasks.googleapis.com/tasks/v1/lists/${task.listId}/tasks/${task.id}`;
      let body = {};

      if (action === 'complete') {
        body = JSON.stringify({ status: 'completed' });
      } else {
        let date = new Date();
        if (action === 'tomorrow') date.setDate(date.getDate() + 1);
        if (action === 'monday') date.setDate(date.getDate() + ((1 + 7 - date.getDay()) % 7 || 7));
        if (action === 'custom') date = new Date(customDate);
        body = JSON.stringify({ due: date.toISOString() });
      }

      await fetch(url, {
        method: 'PATCH', 
        headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
        body
      });

      currentIndex++;
      showNextTask();
    }

    function submitCustomDate() {
      const val = document.getElementById('custom-date').value;
      if (val) {
        document.getElementById('modal').style.display = 'none';
        updateTask('custom', val);
      }
    }
  </script>
</body>
</html>
