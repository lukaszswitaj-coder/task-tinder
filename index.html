<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Swipe</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <style>
    body { 
      font-family: sans-serif; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
      background: #121212; 
      color: #fff; 
      flex-direction: column;
      overflow: hidden;
      touch-action: none;
      padding: 20px 10px;
      box-sizing: border-box;
    }
    
    /* Paski z instrukcjami */
    .hint-bar {
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 90%;
      max-width: 350px;
      box-sizing: border-box;
    }
    
    .horizontal-hints {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 380px;
      font-size: 0.85rem;
      color: #aaa;
      padding: 0 10px;
      box-sizing: border-box;
    }

    #card-container {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
    }

    #card { 
      width: 85%; 
      max-width: 350px; 
      height: 280px; 
      background: #1e1e1e; 
      border-radius: 16px; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center; 
      padding: 24px; 
      text-align: center; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.6); 
      user-select: none; 
      position: absolute; 
      box-sizing: border-box;
      border: 1px solid #2a2a2a;
    }

    #task-title {
      font-size: 1.2rem;
      line-height: 1.4;
      font-weight: bold;
    }

    #task-list-name {
      font-size: 0.8rem;
      color: #007bff;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #modal { 
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0,0,0,0.85); 
      justify-content: center; 
      align-items: center; 
      z-index: 10;
    }

    .modal-content { 
      background: #222; 
      padding: 24px; 
      border-radius: 12px; 
      text-align: center; 
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    input[type="date"] {
      padding: 10px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #444;
      background: #333;
      color: white;
    }

    button { 
      padding: 12px 24px; 
      font-size: 1rem; 
      margin-top: 10px; 
      cursor: pointer; 
      border-radius: 8px;
      border: none;
      background: #007bff;
      color: white;
      font-weight: bold;
    }

    #switch-account {
      background: transparent;
      color: #666;
      font-size: 0.75rem;
      text-decoration: underline;
      border: none;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- Górna instrukcja -->
  <div class="hint-bar">
    ⬆️ <b>GÓRA:</b> Przesuń na poniedziałek
  </div>

  <!-- Główny obszar z kartą i wskaźnikami bocznymi -->
  <div id="card-container">
    <button id="login-btn" onclick="handleAuth()">Zaloguj z Google</button>
    
    <div id="card" style="display:none;">
      <div id="task-list-name"></div>
      <div id="task-title">Ładowanie zadań...</div>
      <div style="font-size: 0.7rem; color: #555; margin-top: 15px;">👆 Przytrzymaj = Kalendarz</div>
    </div>
  </div>

  <!-- Wskaźniki Lewo / Prawo -->
  <div class="horizontal-hints">
    <span>⬅️ <b>LEWO:</b> Na jutro</span>
    <span><b>PRAWO:</b> Na dziś ➡️</span>
  </div>

  <!-- Dolna instrukcja -->
  <div class="hint-bar" style="margin-top: 10px;">
    ⬇️ <b>DÓŁ:</b> Usunięcie zadania
  </div>

  <button id="switch-account" style="display:none;" onclick="handleAuth()">Zmień konto Google</button>

  <!-- Modal kalendarza -->
  <div id="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">Wybierz nową datę</h3>
      <input type="date" id="custom-date">
      <br><br>
      <button onclick="submitCustomDate()">Zapisz</button>
    </div>
  </div>

  <script>
    const CLIENT_ID = '21542541771-b5kbbkkjqivcbrbs7s5dcpittgu1q0fe.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/tasks';
    let accessToken = null, tasks = [], currentIndex = 0, tokenClient;

    function handleAuth() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID, 
        scope: SCOPES,
        prompt: 'select_account',
        callback: (res) => { 
          if (res.error) return;
          accessToken = res.access_token; 
          document.getElementById('login-btn').style.display = 'none'; 
          document.getElementById('switch-account').style.display = 'block';
          currentIndex = 0;
          loadTasks(); 
        }
      });
      tokenClient.requestAccessToken();
    }

    async function fetchAllTasksFromList(listId) {
      let allItems = [];
      let pageToken = '';
      
      do {
        let url = `https://tasks.googleapis.com/tasks/v1/lists/${listId}/tasks?showCompleted=false&maxResults=100`;
        if (pageToken) url += `&pageToken=${pageToken}`;

        const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
        const data = await res.json();
        
        if (data.items) {
          allItems = allItems.concat(data.items);
        }
        pageToken = data.nextPageToken || '';
      } while (pageToken);

      return allItems;
    }

    async function loadTasks() {
      const card = document.getElementById('card');
      const taskTitle = document.getElementById('task-title');
      const taskListName = document.getElementById('task-list-name');

      taskTitle.innerText = "Ładowanie zadań...";
      taskListName.innerText = "";
      card.style.display = 'flex';

      try {
        const listsRes = await fetch('https://tasks.googleapis.com/tasks/v1/users/@me/lists', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        const listsData = await listsRes.json();
        const taskLists = listsData.items || [];

        const now = new Date();
        const todayStr = now.toISOString().split('T')[0];

        tasks = [];

        for (const list of taskLists) {
          const items = await fetchAllTasksFromList(list.id);

          const filtered = items.filter(t => {
            if (!t.title || t.title.trim() === '') return false;
            if (!t.due) return true;

            const taskDateStr = t.due.split('T')[0];
            return taskDateStr <= todayStr;
          }).map(t => ({ ...t, listId: list.id, listTitle: list.title }));

          tasks = tasks.concat(filtered);
        }

        showNextTask();
      } catch (err) {
        console.error(err);
        taskTitle.innerText = "Błąd pobierania zadań!";
      }
    }

    function showNextTask() {
      const card = document.getElementById('card');
      const taskTitle = document.getElementById('task-title');
      const taskListName = document.getElementById('task-list-name');

      if (currentIndex >= tasks.length) {
        taskListName.innerText = "";
        taskTitle.innerText = "Brak zaległych zadań! 🎉";
        return;
      }

      const currentTask = tasks[currentIndex];
      card.style.display = 'flex';
      card.style.transform = 'none';
      
      taskListName.innerText = currentTask.listTitle;
      taskTitle.innerText = currentTask.title;

      initGestures(card);
    }

    function initGestures(el) {
      const mc = new Hammer(el);
      mc.get('swipe').set({ direction: Hammer.DIRECTION_ALL });
      
      mc.on("swipedown", () => updateTask('delete'));
      mc.on("swiperight", () => updateTask('today'));
      mc.on("swipeleft", () => updateTask('tomorrow'));
      mc.on("swipeup", () => updateTask('monday'));
      mc.on("press", () => document.getElementById('modal').style.display = 'flex');
    }

    async function updateTask(action, customDate = null) {
      const task = tasks[currentIndex];
      const url = `https://tasks.googleapis.com/tasks/v1/lists/${task.listId}/tasks/${task.id}`;
      let method = 'PATCH', body = {};

      if (action === 'delete') {
        method = 'DELETE';
      } else {
        let date = new Date();
        if (action === 'tomorrow') date.setDate(date.getDate() + 1);
        if (action === 'monday') date.setDate(date.getDate() + ((1 + 7 - date.getDay()) % 7 || 7));
        if (action === 'custom') date = new Date(customDate);
        body = JSON.stringify({ due: date.toISOString() });
      }

      await fetch(url, {
        method, 
        headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
        body: method !== 'DELETE' ? body : null
      });

      currentIndex++;
      showNextTask();
    }

    function submitCustomDate() {
      const val = document.getElementById('custom-date').value;
      if (val) {
        document.getElementById('modal').style.display = 'none';
        updateTask('custom', val);
      }
    }
  </script>
</body>
</html>
