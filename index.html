<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Task Swipe</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: space-between; 
      min-height: 100vh;
      min-height: 100dvh; 
      margin: 0; 
      background: #0f0f12; 
      color: #fff; 
      overflow-y: auto;
      touch-action: manipulation;
      padding: 10px 10px 16px 10px;
    }
    
    /* Nawigacja trybów */
    .nav-modes {
      display: flex;
      gap: 6px;
      width: 100%;
      max-width: 360px;
      background: #1a1a24;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid #2e2e3e;
      flex-shrink: 0;
    }

    .mode-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 0.75rem;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #aaa;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0;
    }

    .mode-btn.active {
      background: #007bff;
      color: #fff;
    }

    /* Paski z instrukcjami */
    .hint-bar {
      font-size: 0.75rem;
      color: #a55eea;
      text-align: center;
      background: rgba(165, 94, 234, 0.08);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(165, 94, 234, 0.2);
      width: 100%;
      max-width: 360px;
      margin-top: 4px;
      flex-shrink: 0;
    }
    
    .horizontal-hints {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 360px;
      font-size: 0.72rem;
      color: #aaa;
      padding: 0 4px;
      flex-shrink: 0;
    }

    #card-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      margin: 6px 0;
    }

    #card { 
      width: 100%; 
      max-height: 42dvh; 
      min-height: 180px;
      background: #1a1a24; 
      border-radius: 16px; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center; 
      padding: 16px 14px; 
      text-align: center; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
      user-select: none; 
      position: relative; 
      border: 2px solid #2e2e3e;
      overflow-y: auto;
      will-change: transform;
      transition: background-color 0.2s, border-color 0.2s;
    }

    #task-title {
      font-size: 1.1rem;
      line-height: 1.35;
      font-weight: 600;
      word-break: break-word;
      white-space: pre-wrap;
      color: #ffffff;
      margin-bottom: 6px;
    }

    #task-list-name {
      font-size: 0.68rem;
      color: #ff9f43;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
    }

    #task-due-date {
      font-size: 0.72rem;
      color: #ff5252;
      background: rgba(255, 82, 82, 0.1);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      display: inline-block;
    }

    /* Przycisk akcji zakonczenia szybkich zadań */
    #quick-finish-bar {
      display: none;
      width: 100%;
      max-width: 360px;
      margin-top: 6px;
      flex-shrink: 0;
    }

    /* Siatka planowania tygodniowego */
    #week-grid-container {
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 360px;
      margin-top: 6px;
      flex-shrink: 0;
    }

    .week-day-btn {
      background: #1e1e2d;
      border: 1px solid #33334d;
      border-radius: 10px;
      padding: 6px 2px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.68rem;
      transition: all 0.15s ease;
    }

    .week-day-btn:active {
      background: #007bff;
      border-color: #007bff;
      transform: scale(0.95);
    }

    .week-day-btn .day-title {
      font-weight: bold;
      margin-bottom: 1px;
    }

    .week-day-btn .day-date {
      font-size: 0.62rem;
      color: #aaa;
    }

    .week-day-btn .day-badge {
      margin-top: 3px;
      background: rgba(0, 123, 255, 0.25);
      color: #70a1ff;
      font-weight: bold;
      padding: 1px 5px;
      border-radius: 8px;
      font-size: 0.62rem;
    }

    /* Widok Wykonania Szybkich Zadań (Checklist) */
    #quick-list-view {
      display: none;
      flex-direction: column;
      width: 100%;
      max-width: 360px;
      flex-grow: 1;
      background: #1a1a24;
      border-radius: 16px;
      padding: 14px;
      border: 1px solid #2e2e3e;
      overflow-y: auto;
      margin: 8px 0;
    }

    .quick-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #252533;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid #333346;
    }

    .quick-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #2ed573;
      cursor: pointer;
    }

    .quick-item-title {
      font-size: 0.88rem;
      line-height: 1.3;
      flex-grow: 1;
    }

    .quick-item-title.done {
      text-decoration: line-through;
      color: #666;
    }

    #modal { 
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0,0,0,0.85); 
      justify-content: center; 
      align-items: center; 
      z-index: 10;
    }

    .modal-content { 
      background: #222; 
      padding: 20px; 
      border-radius: 16px; 
      text-align: center; 
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      width: 85%;
      max-width: 320px;
    }

    input[type="date"] {
      padding: 10px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #444;
      background: #333;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    button.action-btn { 
      padding: 10px 16px; 
      font-size: 0.88rem; 
      margin-top: 8px; 
      cursor: pointer; 
      border-radius: 8px;
      border: none;
      background: #007bff;
      color: white;
      font-weight: bold;
      width: 100%;
    }

    #switch-account {
      background: transparent;
      color: #666;
      font-size: 0.72rem;
      text-decoration: underline;
      border: none;
      flex-shrink: 0;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- Menu Trybów -->
  <div class="nav-modes">
    <button class="mode-btn active" id="btn-mode-overdue" onclick="switchMode('overdue')">Zaległe</button>
    <button class="mode-btn" id="btn-mode-quick" onclick="switchMode('quick')">⚡ Szybkie</button>
    <button class="mode-btn" id="btn-mode-week" onclick="switchMode('week')">📅 Tydzień</button>
  </div>

  <!-- Górny pasek wskazówek -->
  <div class="hint-bar" id="hint-top">
    ⬆️️ <b>SWIPE UP:</b> Kolejny poniedziałek
  </div>

  <!-- Główny kontener fiszek -->
  <div id="card-container">
    <button id="login-btn" class="action-btn" onclick="handleAuth()">Zaloguj z Google</button>
    
    <div id="card" style="display:none;">
      <div id="task-list-name"></div>
      <div id="task-due-date"></div>
      <div id="task-title">Ładowanie zadań...</div>
      <div id="hold-hint" style="font-size: 0.68rem; color: #777; margin-top: 4px;">👆 Przytrzymaj = Kalendarz (Inna data)</div>

      <button id="reload-btn" class="action-btn" style="display:none;" onclick="reloadTasks()">Odśwież listę 🔄</button>
    </div>
  </div>

  <!-- Dedykowany stały pasek zakończenia wyboru szybkich zadań -->
  <div id="quick-finish-bar">
    <button class="action-btn" style="background:#2ed573; margin:0;" onclick="showQuickTasksList()">
      Zakończ szukanie i przejdź do zadań (<span id="quick-count">0</span>/5) ➔
    </button>
  </div>

  <!-- Siatka Planowania Tygodniowego -->
  <div id="week-grid-container"></div>

  <!-- Lista kontrolna Szybkich Zadań (Faza 2 trybu Szybkie) -->
  <div id="quick-list-view">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3 style="margin:0; font-size:1rem; color:#2ed573;">⚡ Lista Szybkich Zadań</h3>
      <button class="action-btn" style="margin:0; width:auto; padding:4px 8px; font-size:0.72rem; background:#444;" onclick="backToQuickSwipe()">+ Szukaj więcej</button>
    </div>
    <div id="quick-items-container"></div>
  </div>

  <!-- Wskaźniki Lewo / Prawo -->
  <div class="horizontal-hints" id="hint-horizontal">
    <span id="hint-left">⬅️️ <b>LEWO:</b> Na jutro</span>
    <span id="hint-right"><b>PRAWO:</b> Na dziś ➡️</span>
  </div>

  <!-- Dolny pasek wskazówek -->
  <div class="hint-bar" id="hint-bottom" style="color: #2ed573; background: rgba(46, 213, 115, 0.08); border-color: rgba(46, 213, 115, 0.2);">
    ⬇️ <b>SWIPE DOWN:</b> Oznacz jako zrobione
  </div>

  <button id="switch-account" style="display:none;" onclick="logout()">Zmień konto / Wyloguj</button>

  <!-- Modal kalendarza -->
  <div id="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">Wybierz datę przełożenia</h3>
      <input type="date" id="custom-date">
      <br>
      <button class="action-btn" onclick="submitCustomDate()">Zapisz</button>
    </div>
  </div>

  <script>
    const CLIENT_ID = '21542541771-b5kbbkkjqivcbrbs7s5dcpittgu1q0fe.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/tasks';
    
    let accessToken = localStorage.getItem('google_tasks_token') || null;
    let tasks = [], currentIndex = 0, tokenClient, hammerManager = null;
    
    // Stan aplikacji
    let currentMode = 'overdue'; // 'overdue' | 'quick' | 'week'
    let quickTasksList = []; 
    let dayTaskCounts = {};

    window.addEventListener('DOMContentLoaded', () => {
      if (accessToken) {
        document.getElementById('login-btn').style.display = 'none';
        document.getElementById('switch-account').style.display = 'block';
        loadTasks();
      }
    });

    function handleAuth() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID, 
        scope: SCOPES,
        prompt: 'select_account',
        callback: (res) => { 
          if (res.error) return;
          accessToken = res.access_token; 
          localStorage.setItem('google_tasks_token', accessToken);
          document.getElementById('login-btn').style.display = 'none'; 
          document.getElementById('switch-account').style.display = 'block';
          reloadTasks();
        }
      });
      tokenClient.requestAccessToken();
    }

    function logout() {
      localStorage.removeItem('google_tasks_token');
      accessToken = null;
      document.getElementById('card').style.display = 'none';
      document.getElementById('quick-list-view').style.display = 'none';
      document.getElementById('week-grid-container').style.display = 'none';
      document.getElementById('quick-finish-bar').style.display = 'none';
      document.getElementById('login-btn').style.display = 'block';
      document.getElementById('switch-account').style.display = 'none';
    }

    function getWeekDaysList() {
      const dayNames = ['Niedz', 'Pon', 'Wt', 'Śr', 'Czw', 'Pt', 'Sob'];
      const now = new Date();
      const currentDay = now.getDay(); 
      
      const diffToMon = currentDay === 0 ? -6 : 1 - currentDay;
      const mon = new Date(now);
      mon.setDate(now.getDate() + diffToMon);

      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(mon);
        d.setDate(mon.getDate() + i);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const dateStr = `${yyyy}-${mm}-${dd}`;
        
        days.push({
          name: dayNames[d.getDay()],
          dateStr: dateStr,
          displayDate: `${dd}.${mm}`
        });
      }

      const nextMon = new Date(mon);
      nextMon.setDate(mon.getDate() + 7);
      const yyyyN = nextMon.getFullYear();
      const mmN = String(nextMon.getMonth() + 1).padStart(2, '0');
      const ddN = String(nextMon.getDate()).padStart(2, '0');
      
      days.push({
        name: 'Kol. Pon',
        dateStr: `${yyyyN}-${mmN}-${ddN}`,
        displayDate: `${ddN}.${mmN}`
      });

      return days;
    }

    function switchMode(newMode) {
      currentMode = newMode;
      
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-mode-${newMode}`).classList.add('active');

      document.getElementById('quick-list-view').style.display = 'none';
      document.getElementById('card-container').style.display = 'flex';
      
      if (newMode === 'week') {
        document.getElementById('week-grid-container').style.display = 'grid';
        document.getElementById('quick-finish-bar').style.display = 'none';
        document.getElementById('hint-top').style.display = 'none';
        document.getElementById('hint-horizontal').style.display = 'none';
        document.getElementById('hint-bottom').style.display = 'none';
      } else if (newMode === 'quick') {
        document.getElementById('week-grid-container').style.display = 'none';
        document.getElementById('quick-finish-bar').style.display = quickTasksList.length > 0 ? 'block' : 'none';
        document.getElementById('hint-top').style.display = 'block';
        document.getElementById('hint-horizontal').style.display = 'flex';
        document.getElementById('hint-bottom').style.display = 'block';
        updateHints();
      } else {
        document.getElementById('week-grid-container').style.display = 'none';
        document.getElementById('quick-finish-bar').style.display = 'none';
        document.getElementById('hint-top').style.display = 'block';
        document.getElementById('hint-horizontal').style.display = 'flex';
        document.getElementById('hint-bottom').style.display = 'block';
        updateHints();
      }

      reloadTasks();
    }

    function updateHints() {
      const top = document.getElementById('hint-top');
      const left = document.getElementById('hint-left');
      const right = document.getElementById('hint-right');
      const bottom = document.getElementById('hint-bottom');

      if (currentMode === 'quick') {
        top.innerHTML = "⬆️ <b>SWIPE UP:</b> Przesuń na poniedziałek";
        left.innerHTML = "⬅️ <b>LEWO:</b> Długie / Pomiń";
        right.innerHTML = "<b>PRAWO:</b> ⚡ Szybkie (dodaj)";
        bottom.innerHTML = "⬇️ <b>SWIPE DOWN:</b> Zrobione teraz";
        bottom.style.color = "#2ed573";
      } else {
        top.innerHTML = "⬆️ <b>SWIPE UP:</b> Kolejny poniedziałek";
        left.innerHTML = "⬅️ <b>LEWO:</b> Na jutro";
        right.innerHTML = "<b>PRAWO:</b> Na dziś ➡️";
        bottom.innerHTML = "⬇️ <b>SWIPE DOWN:</b> Oznacz jako zrobione";
        bottom.style.color = "#2ed573";
      }
    }

    function renderWeekGrid() {
      const container = document.getElementById('week-grid-container');
      container.innerHTML = '';

      const days = getWeekDaysList();
      days.forEach(d => {
        const count = dayTaskCounts[d.dateStr] || 0;
        const btn = document.createElement('div');
        btn.className = 'week-day-btn';
        btn.onclick = () => assignToWeekDay(d.dateStr);
        btn.innerHTML = `
          <div class="day-title">${d.name}</div>
          <div class="day-date">${d.displayDate}</div>
          <div class="day-badge">${count}</div>
        `;
        container.appendChild(btn);
      });
    }

    function reloadTasks() {
      currentIndex = 0;
      tasks = [];
      document.getElementById('reload-btn').style.display = 'none';
      loadTasks();
    }

    async function loadTasks() {
      const card = document.getElementById('card');
      const taskTitle = document.getElementById('task-title');
      const taskListName = document.getElementById('task-list-name');
      const taskDueDate = document.getElementById('task-due-date');

      taskTitle.innerText = "Ładowanie zadań...";
      taskListName.innerText = "";
      taskDueDate.innerText = "";
      card.style.display = 'flex';

      try {
        const listsRes = await fetch('https://tasks.googleapis.com/tasks/v1/users/@me/lists', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        
        if (listsRes.status === 401) { logout(); return; }

        const listsData = await listsRes.json();
        const taskLists = listsData.items || [];

        const now = new Date();
        const todayStr = now.toISOString().split('T')[0];

        dayTaskCounts = {};
        tasks = [];

        for (const list of taskLists) {
          const res = await fetch(`https://tasks.googleapis.com/tasks/v1/lists/${list.id}/tasks?showCompleted=false&maxResults=100`, {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          const data = await res.json();
          const items = data.items || [];

          items.forEach(t => {
            if (t.due && !t.completed) {
              const dStr = t.due.split('T')[0];
              dayTaskCounts[dStr] = (dayTaskCounts[dStr] || 0) + 1;
            }
          });

          const mapped = items.filter(t => {
            if (!t.title || t.title.trim() === '') return false;

            if (currentMode === 'overdue') {
              return t.due && t.due.split('T')[0] < todayStr;
            } else if (currentMode === 'quick') {
              return !t.due || t.due.split('T')[0] <= todayStr;
            } else if (currentMode === 'week') {
              return true;
            }
            return true;
          }).map(t => ({ 
            ...t, 
            listId: list.id, 
            listTitle: list.title,
            formattedDueDate: t.due ? t.due.split('T')[0] : 'Brak daty'
          }));

          tasks = tasks.concat(mapped);
        }

        if (currentMode === 'week') renderWeekGrid();
        showNextTask();
      } catch (err) {
        console.error(err);
        taskTitle.innerText = "Błąd pobierania zadań!";
      }
    }

    function showNextTask() {
      const card = document.getElementById('card');
      const taskTitle = document.getElementById('task-title');
      const taskListName = document.getElementById('task-list-name');
      const taskDueDate = document.getElementById('task-due-date');
      const holdHint = document.getElementById('hold-hint');
      const reloadBtn = document.getElementById('reload-btn');

      card.style.transition = 'none';
      card.style.transform = 'none';
      card.style.backgroundColor = '#1a1a24';
      card.style.borderColor = '#2e2e3e';

      document.getElementById('quick-count').innerText = quickTasksList.length;
      if (currentMode === 'quick' && quickTasksList.length > 0) {
        document.getElementById('quick-finish-bar').style.display = 'block';
      }

      if (currentIndex >= tasks.length) {
        taskListName.innerText = "";
        taskDueDate.style.display = "none";
        holdHint.style.display = "none";
        
        if (currentMode === 'quick' && quickTasksList.length > 0) {
          showQuickTasksList();
          return;
        }

        taskTitle.innerText = "Brak kolejnych zadań w tym trybie! 🎉";
        reloadBtn.style.display = "inline-block";
        return;
      }

      holdHint.style.display = "block";
      reloadBtn.style.display = "none";

      const currentTask = tasks[currentIndex];
      card.style.display = 'flex';
      
      taskListName.innerText = currentTask.listTitle;
      taskDueDate.style.display = "inline-block";
      taskDueDate.innerText = `⏰ Termin: ${currentTask.formattedDueDate}`;
      taskTitle.innerText = currentTask.title;

      initGestures(card);
    }

    function initGestures(el) {
      if (hammerManager) hammerManager.destroy();

      hammerManager = new Hammer(el);
      hammerManager.get('pan').set({ direction: Hammer.DIRECTION_ALL });

      const THRESHOLD = 80;

      hammerManager.on("panmove", (ev) => {
        const x = ev.deltaX;
        const y = ev.deltaY;
        const rotate = x * 0.05;

        el.style.transition = 'none';
        el.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${rotate}deg)`;

        if (Math.abs(y) > Math.abs(x)) {
          if (y > 30) {
            el.style.backgroundColor = 'rgba(46, 213, 115, 0.2)'; el.style.borderColor = '#2ed573';
          } else if (y < -30) {
            el.style.backgroundColor = 'rgba(165, 94, 234, 0.2)'; el.style.borderColor = '#a55eea';
          }
        } else {
          if (x > 30) {
            if (currentMode === 'quick') {
              el.style.backgroundColor = 'rgba(255, 205, 86, 0.25)'; el.style.borderColor = '#ffcd56';
            } else {
              el.style.backgroundColor = 'rgba(0, 122, 255, 0.2)'; el.style.borderColor = '#007bff';
            }
          } else if (x < -30) {
            if (currentMode === 'quick') {
              el.style.backgroundColor = 'rgba(120, 120, 120, 0.2)'; el.style.borderColor = '#777';
            } else {
              el.style.backgroundColor = 'rgba(255, 159, 67, 0.2)'; el.style.borderColor = '#ff9f43';
            }
          }
        }
      });

      hammerManager.on("panend", (ev) => {
        const x = ev.deltaX;
        const y = ev.deltaY;

        el.style.transition = 'transform 0.25s ease, background-color 0.25s, border-color 0.25s';

        if (Math.abs(y) > Math.abs(x) && Math.abs(y) > THRESHOLD) {
          if (y > 0) updateTask('complete');
          else updateTask('monday');
        } else if (Math.abs(x) > Math.abs(y) && Math.abs(x) > THRESHOLD) {
          if (x > 0) {
            if (currentMode === 'quick') addQuickTask();
            else updateTask('today');
          } else {
            if (currentMode === 'quick') skipQuickTask();
            else updateTask('tomorrow');
          }
        } else {
          el.style.transform = 'translate3d(0, 0, 0) rotate(0deg)';
          el.style.backgroundColor = '#1a1a24';
          el.style.borderColor = '#2e2e3e';
        }
      });

      hammerManager.on("press", () => document.getElementById('modal').style.display = 'flex');
    }

    async function assignToWeekDay(targetDateStr) {
      if (currentIndex >= tasks.length) return;
      const task = tasks[currentIndex];

      if (task.formattedDueDate && dayTaskCounts[task.formattedDueDate]) {
        dayTaskCounts[task.formattedDueDate]--;
      }
      dayTaskCounts[targetDateStr] = (dayTaskCounts[targetDateStr] || 0) + 1;
      renderWeekGrid();

      const url = `https://tasks.googleapis.com/tasks/v1/lists/${task.listId}/tasks/${task.id}`;
      const targetDateISO = new Date(`${targetDateStr}T00:00:00.000Z`).toISOString();

      await fetch(url, {
        method: 'PATCH',
        headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ due: targetDateISO })
      });

      currentIndex++;
      showNextTask();
    }

    function addQuickTask() {
      const task = tasks[currentIndex];
      quickTasksList.push(task);
      currentIndex++;

      if (quickTasksList.length >= 5) {
        showQuickTasksList();
      } else {
        showNextTask();
      }
    }

    function skipQuickTask() {
      currentIndex++;
      showNextTask();
    }

    function showQuickTasksList() {
      document.getElementById('card-container').style.display = 'none';
      document.getElementById('hint-horizontal').style.display = 'none';
      document.getElementById('hint-bottom').style.display = 'none';
      document.getElementById('week-grid-container').style.display = 'none';
      document.getElementById('quick-finish-bar').style.display = 'none';
      document.getElementById('quick-list-view').style.display = 'flex';

      renderQuickChecklist();
    }

    function backToQuickSwipe() {
      document.getElementById('quick-list-view').style.display = 'none';
      document.getElementById('card-container').style.display = 'flex';
      document.getElementById('hint-horizontal').style.display = 'flex';
      document.getElementById('hint-bottom').style.display = 'block';
      if (quickTasksList.length > 0) {
        document.getElementById('quick-finish-bar').style.display = 'block';
      }
      showNextTask();
    }

    function renderQuickChecklist() {
      const container = document.getElementById('quick-items-container');
      container.innerHTML = '';

      if (quickTasksList.length === 0) {
        container.innerHTML = '<div style="color:#888; text-align:center; padding:20px;">Brak wybranych szybkich zadań.</div>';
        return;
      }

      quickTasksList.forEach((task, idx) => {
        const item = document.createElement('div');
        item.className = 'quick-item';
        item.innerHTML = `
          <input type="checkbox" id="chk-${idx}" ${task.completed ? 'checked disabled' : ''} onchange="completeQuickListItem(${idx})">
          <div class="quick-item-title ${task.completed ? 'done' : ''}" id="title-${idx}">
            <div style="font-size:0.68rem; color:#ff9f43; font-weight:bold;">${task.listTitle}</div>
            ${task.title}
          </div>
        `;
        container.appendChild(item);
      });
    }

    async function completeQuickListItem(idx) {
      const task = quickTasksList[idx];
      task.completed = true;

      document.getElementById(`title-${idx}`).classList.add('done');
      document.getElementById(`chk-${idx}`).disabled = true;

      const url = `https://tasks.googleapis.com/tasks/v1/lists/${task.listId}/tasks/${task.id}`;
      await fetch(url, {
        method: 'PATCH',
        headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'completed' })
      });
    }

    async function updateTask(action, customDate = null) {
      const task = tasks[currentIndex];
      const url = `https://tasks.googleapis.com/tasks/v1/lists/${task.listId}/tasks/${task.id}`;
      let body = {};

      if (action === 'complete') {
        body = JSON.stringify({ status: 'completed' });
      } else {
        let date = new Date();
        if (action === 'tomorrow') date.setDate(date.getDate() + 1);
        if (action === 'monday') date.setDate(date.getDate() + ((1 + 7 - date.getDay()) % 7 || 7));
        if (action === 'custom') date = new Date(customDate);
        body = JSON.stringify({ due: date.toISOString() });
      }

      await fetch(url, {
        method: 'PATCH', 
        headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
        body
      });

      currentIndex++;
      showNextTask();
    }

    function submitCustomDate() {
      const val = document.getElementById('custom-date').value;
      if (val) {
        document.getElementById('modal').style.display = 'none';
        updateTask('custom', val);
      }
    }
  </script>
</body>
</html>
