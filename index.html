<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Task Swipe</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
      background: #0f0f12; 
      color: #fff; 
      flex-direction: column;
      overflow: hidden;
      touch-action: none;
      padding: 16px 12px;
    }
    
    .hint-bar {
      font-size: 0.85rem;
      color: #00d2ff;
      text-align: center;
      background: rgba(0, 210, 255, 0.08);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0, 210, 255, 0.2);
      width: 100%;
      max-width: 360px;
    }
    
    .horizontal-hints {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 360px;
      font-size: 0.8rem;
      color: #aaa;
      padding: 0 4px;
    }

    #card-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      margin: 12px 0;
    }

    #card { 
      width: 100%; 
      max-height: 70vh; 
      background: #1a1a24; 
      border-radius: 20px; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center; 
      padding: 24px 20px; 
      text-align: center; 
      box-shadow: 0 12px 30px rgba(0,0,0,0.7); 
      user-select: none; 
      position: relative; 
      border: 1px solid #2e2e3e;
      overflow-y: auto;
    }

    #task-title {
      font-size: 1.25rem;
      line-height: 1.5;
      font-weight: 600;
      word-break: break-word;
      white-space: pre-wrap;
      color: #ffffff;
      margin-bottom: 12px;
    }

    #task-list-name {
      font-size: 0.75rem;
      color: #ff9f43;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
    }

    #task-due-date {
      font-size: 0.8rem;
      color: #ff5252;
      background: rgba(255, 82, 82, 0.1);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 14px;
      display: inline-block;
    }

    #modal { 
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0,0,0,0.85); 
      justify-content: center; 
      align-items: center; 
      z-index: 10;
    }

    .modal-content { 
      background: #222; 
      padding: 24px; 
      border-radius: 16px; 
      text-align: center; 
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      width: 85%;
      max-width: 320px;
    }

    input[type="date"] {
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #444;
      background: #333;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    button { 
      padding: 12px 24px; 
      font-size: 1rem; 
      margin-top: 12px; 
      cursor: pointer; 
      border-radius: 10px;
      border: none;
      background: #007bff;
      color: white;
      font-weight: bold;
    }

    #switch-account {
      background: transparent;
      color: #666;
      font-size: 0.75rem;
      text-decoration: underline;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Górna instrukcja -->
  <div class="hint-bar">
    ⬆️ <b>SWIPE UP:</b> Kolejny poniedziałek
  </div>

  <!-- Główny kontener -->
  <div id="card-container">
    <button id="login-btn" onclick="handleAuth()">Zaloguj z Google</button>
    
    <div id="card" style="display:none;">
      <div id="task-list-name"></div>
      <div id="task-due-date"></div>
      <div id="task-title">Ładowanie zadań...</div>
      <div style="font-size: 0.75rem; color: #777; margin-top: 10px;">👆 Przytrzymaj = Wybór daty w kalendarzu</div>
    </div>
  </div>

  <!-- Wskaźniki Lewo / Prawo -->
  <div class="horizontal-hints">
    <span>⬅️ <b>LEWO:</b> Przesuń na jutro</span>
    <span><b>PRAWO:</b> Przesuń na dziś ➡️</span>
  </div>

  <!-- Dolna instrukcja -->
  <div class="hint-bar" style="color: #2ed573; background: rgba(46, 213, 115, 0.08); border-color: rgba(46, 213, 115, 0.2);">
    ⬇️ <b>SWIPE DOWN:</b> Oznacz jako zrobione (odhacz)
  </div>

  <button id="switch-account" style="display:none;" onclick="handleAuth()">Zmień konto Google</button>

  <!-- Modal kalendarza -->
  <div id="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">Wybierz datę przełożenia</h3>
      <input type="date" id="custom-date">
      <br>
      <button onclick="submitCustomDate()">Zapisz</button>
    </div>
  </div>

  <script>
    const CLIENT_ID = '21542541771-b5kbbkkjqivcbrbs7s5dcpittgu1q0fe.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/tasks';
    let accessToken = null, tasks = [], currentIndex = 0, tokenClient;

    function handleAuth() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID, 
        scope: SCOPES,
        prompt: 'select_account',
        callback: (res) => { 
          if (res.error) return;
          accessToken = res.access_token; 
          document.getElementById('login-btn').style.display = 'none'; 
          document.getElementById('switch-account').style.display = 'block';
          currentIndex = 0;
          loadTasks(); 
        }
      });
      tokenClient.requestAccessToken();
    }

    async function fetchAllTasksFromList(listId) {
      let allItems = [];
      let pageToken = '';
      
      do {
        let url = `https://tasks.googleapis.com/tasks/v1/lists/${listId}/tasks?showCompleted=false&maxResults=100`;
        if (pageToken) url += `&pageToken=${pageToken}`;

        const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
        const data = await res.json();
        
        if (data.items) {
          allItems = allItems.concat(data.items);
        }
        pageToken = data.nextPageToken || '';
      } while (pageToken);

      return allItems;
    }

    async function loadTasks() {
      const card = document.getElementById('card');
      const taskTitle = document.getElementById('task-title');
      const taskListName = document.getElementById('task-list-name');
      const taskDueDate = document.getElementById('task-due-date');

      taskTitle.innerText = "Ładowanie zaległych zadań...";
      taskListName.innerText = "";
      taskDueDate.innerText = "";
      card.style.display = 'flex';

      try {
        const listsRes = await fetch('https://tasks.googleapis.com/tasks/v1/users/@me/lists', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        const listsData = await listsRes.json();
        const taskLists = listsData.items || [];

        // Pobieramy dzisiejszą datę w formacie YYYY-MM-DD
        const now = new Date();
        const todayStr = now.toISOString().split('T')[0];

        tasks = [];

        for (const list of taskLists) {
          const items = await fetchAllTasksFromList(list.id);

          const filtered = items.filter(t => {
            if (!t.title || t.title.trim() === '') return false;
            if (!t.due) return false; // Odrzucamy zadania bez daty

            const taskDateStr = t.due.split('T')[0];
            
            // STYL STRICTLY OLD: tylko zadania z datą MNIEJSZĄ niż dzisiaj (wczoraj i wcześniej)
            return taskDateStr < todayStr;
          }).map(t => ({ 
            ...t, 
            listId: list.id, 
            listTitle: list.title,
            formattedDueDate: t.due.split('T')[0]
          }));

          tasks = tasks.concat(filtered);
        }

        showNextTask();
      } catch (err) {
        console.error(err);
        taskTitle.innerText = "Błąd pobierania zadań!";
      }
    }

    function showNextTask() {
      const card = document.getElementById('card');
      const taskTitle = document.getElementById('task-title');
      const taskListName = document.getElementById('task-list-name');
      const taskDueDate = document.getElementById('task-due-date');

      if (currentIndex >= tasks.length) {
        taskListName.innerText = "";
        taskDueDate.style.display = "none";
        taskTitle.innerText = "Brak zaległych zadań sprzed dzisiaj! 🎉";
        return;
      }

      const currentTask = tasks[currentIndex];
      card.style.display = 'flex';
      card.style.transform = 'none';
      
      taskListName.innerText = currentTask.listTitle;
      taskDueDate.style.display = "inline-block";
      taskDueDate.innerText = `⏰ Zaległe od: ${currentTask.formattedDueDate}`;
      taskTitle.innerText = currentTask.title;

      initGestures(card);
    }

    function initGestures(el) {
      const mc = new Hammer(el);
      mc.get('swipe').set({ direction: Hammer.DIRECTION_ALL });
      
      mc.on("swipedown", () => updateTask('complete'));
      mc.on("swiperight", () => updateTask('today'));
      mc.on("swipeleft", () => updateTask('tomorrow'));
      mc.on("swipeup", () => updateTask('monday'));
      mc.on("press", () => document.getElementById('modal').style.display = 'flex');
    }

    async function updateTask(action, customDate = null) {
      const task = tasks[currentIndex];
      const url = `https://tasks.googleapis.com/tasks/v1/lists/${task.listId}/tasks/${task.id}`;
      let method = 'PATCH', body = {};

      if (action === 'complete') {
        // Oznaczenie jako zrobione
        body = JSON.stringify({ status: 'completed' });
      } else {
        let date = new Date();
        if (action === 'tomorrow') date.setDate(date.getDate() + 1);
        if (action === 'monday') date.setDate(date.getDate() + ((1 + 7 - date.getDay()) % 7 || 7));
        if (action === 'custom') date = new Date(customDate);
        body = JSON.stringify({ due: date.toISOString() });
      }

      await fetch(url, {
        method, 
        headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
        body
      });

      currentIndex++;
      showNextTask();
    }

    function submitCustomDate() {
      const val = document.getElementById('custom-date').value;
      if (val) {
        document.getElementById('modal').style.display = 'none';
        updateTask('custom', val);
      }
    }
  </script>
</body>
</html>
